<body>
    <div class="container">
        <!-- Menu Screen -->
        <div class="menu-screen active" id="menuScreen">
            <h1 class="menu-title">🕷️ Scale Spider</h1>
            <p class="menu-subtitle">Solitario delle Scale Maggiori</p>
            
            <div class="level-buttons">
                <button class="level-btn" onclick="startGame('easy')">
                    <div>🟢 Livello Facile</div>
                    <div class="level-info">4 scale maggiori</div>
                </button>
                
                <button class="level-btn" onclick="startGame('medium')">
                    <div>🟡 Livello Medio</div>
                    <div class="level-info">6 scale maggiori</div>
                </button>
                
                <button class="level-btn" onclick="startGame('hard')">
                    <div>🔴 Livello Difficile</div>
                    <div class="level-info">8 scale maggiori</div>
                </button>
            </div>
        </div>

        <!-- Game Screen -->
        <div class="game-screen" id="gameScreen">
            <div class="game-header">
                <h2 class="game-title">🕷️ Scale Spider</h2>
                <div class="stats">
                    <div class="stat success">
                        ✅ <span id="successCount">0</span>
                    </div>
                    <div class="stat error">
                        ❌ <span id="errorCount">0</span>
                    </div>
                </div>
                <button class="menu-btn" onclick="goToMenu()">📋 Menu</button>
            </div>

            <div class="game-board">
                <div class="instructions">
                    <span class="instructions-icon">🎯</span>
                    Trascina le carte sulle note corrispondenti
                </div>
                <div class="scale-piles" id="scalePiles">
                    <!-- Scale piles will be generated here -->
                </div>
            </div>

            <div class="cards-area">
                <div class="play-area" id="playArea">
                    <!-- Cards in play will appear here -->
                </div>
                
                <div class="deck-area">
                    <div class="deck" id="deck" onclick="drawCards()">
                        <div class="deck-count" id="deckCount">52</div>
                    </div>
                </div>
            </div>

            <div class="game-footer" id="gameFooter">
                <span class="footer-icon">🎴</span>
                <span id="footerText">Pesca carte dal mazzo per continuare</span>
            </div>
        </div>

        <!-- Victory Screen -->
        <div class="victory-screen" id="victoryScreen">
            <div class="victory-content">
                <div class="victory-title">🎉 Complimenti!</div>
                <div class="victory-stats" id="victoryStats">
                    Hai completato tutte le scale!<br>
                    ✅ Successi: <span id="finalSuccess">0</span><br>
                    ❌ Errori: <span id="finalErrors">0</span><br>
                    📊 Precisione: <span id="accuracy">0</span>%
                </div>
                <div class="victory-buttons">
                    <button class="victory-btn" onclick="playAgain()">🔄 Gioca Ancora</button>
                    <button class="victory-btn" onclick="goToMenu()">📋 Menu</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Game State
        let gameState = {
            level: 'easy',
            scales: [],
            cards: [],
            playCards: [],
            successCount: 0,
            errorCount: 0,
            completedPiles: 0,
            noteCompleted: {}
        };

        // Major scales with their notes (tutte con notazione bemole)
        const majorScales = {
            'C': ['C', 'D', 'E', 'F', 'G', 'A', 'B'],
            'G': ['G', 'A', 'B', 'C', 'D', 'E', 'Gb'],
            'D': ['D', 'E', 'Gb', 'G', 'A', 'B', 'Db'],
            'A': ['A', 'B', 'Db', 'D', 'E', 'Gb', 'Ab'],
            'E': ['E', 'Gb', 'Ab', 'A', 'B', 'Db', 'Eb'],
            'B': ['B', 'Db', 'Eb', 'E', 'Gb', 'Ab', 'Bb'],
            'Gb': ['Gb', 'Ab', 'Bb', 'B', 'Db', 'Eb', 'F'],
            'F': ['F', 'G', 'A', 'Bb', 'C', 'D', 'E'],
            'Bb': ['Bb', 'C', 'D', 'Eb', 'F', 'G', 'A'],
            'Eb': ['Eb', 'F', 'G', 'Ab', 'Bb', 'C', 'D'],
            'Ab': ['Ab', 'Bb', 'C', 'Db', 'Eb', 'F', 'G'],
            'Db': ['Db', 'Eb', 'F', 'Gb', 'Ab', 'Bb', 'C']
        };

        const scaleNames = ['C', 'G', 'D', 'A', 'E', 'B', 'F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb'];

        // Roman numerals for scale degrees
        function getRomanNumeral(degree) {
            const romans = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];
            return romans[degree] || degree;
        }
        const chromaticNotes = ['C', 'C#', 'Db', 'D', 'D#', 'Eb', 'E', 'F', 'F#', 'Gb', 'G', 'G#', 'Ab', 'A', 'A#', 'Bb', 'B'];

        // Start game with specified level
        function startGame(level) {
            gameState.level = level;
            gameState.successCount = 0;
            gameState.errorCount = 0;
            gameState.completedPiles = 0;
            gameState.noteCompleted = {};
            gameState.notesNeeded = [];
            
            // Determine number of scales based on level
            let numScales;
            switch(level) {
                case 'easy': numScales = 4; break;
                case 'medium': numScales = 6; break;
                case 'hard': numScales = 8; break;
            }
            
            // Select random scales
            gameState.scales = selectRandomScales(numScales);
            
            // Generate cards for these scales
            gameState.cards = generateCards(gameState.scales);
            gameState.playCards = [];
            
            // Setup UI (this will create piles only for needed notes)
            setupNotePiles();
            updateStats();
            updateDeckCount();
            
            // Switch to game screen
            document.getElementById('menuScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            
            // Draw initial cards
            drawCards();
        }

        // Select random scales for the level - FIXED to avoid mixing sharp/flat scales
        function selectRandomScales(count) {
            // Separate scales by type to avoid conflicts
            const sharpScales = ['C', 'G', 'D', 'A', 'E', 'B'];
            const flatScales = ['C', 'F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb'];
            
            // Choose either sharp-based or flat-based scales (not mixed)
            const useSharpScales = Math.random() > 0.5;
            const availableScales = useSharpScales ? sharpScales : flatScales;
            
            // Shuffle and select
            const shuffled = [...availableScales].sort(() => Math.random() - 0.5);
            const selected = shuffled.slice(0, Math.min(count, availableScales.length));
            
            console.log(`Selected ${useSharpScales ? 'SHARP' : 'FLAT'} scales:`, selected);
            
            return selected;
        }

        // Generate cards for the selected scales
        function generateCards(scales) {
            const cards = [];
            
            // IMPORTANT: Only generate cards for the scales that were actually selected
            scales.forEach(scale => {
                const scaleNotes = majorScales[scale];
                if (!scaleNotes) {
                    console.error(`Scale ${scale} not found in majorScales!`);
                    return;
                }
                
                for (let degree = 1; degree <= 7; degree++) {
                    const correctNote = scaleNotes[degree - 1];
                    
                    cards.push({
                        scale: scale,
                        degree: degree,
                        correctNote: correctNote,
                        id: `${scale}_${degree}_${Math.random()}`,
                        faceUp: false,
                        flipping: false
                    });
                }
            });
            
            console.log("Generated cards for scales:", scales);
            console.log("Sample cards:", cards.slice(0, 5));
            
            // Add more cards of the same types for longer gameplay
            const duplicatedCards = [...cards, ...cards];
            
            // Shuffle cards
            return duplicatedCards.sort(() => Math.random() - 0.5);
        }

        // Setup note piles in UI - ONLY for notes that appear in selected scales
        function setupNotePiles() {
            const container = document.getElementById('scalePiles');
            container.innerHTML = '';
            
            // Get all unique notes from selected scales
            const uniqueNotes = new Set();
            console.log("Setting up piles for scales:", gameState.scales);
            
            gameState.scales.forEach(scale => {
                const scaleNotes = majorScales[scale];
                console.log(`Scale ${scale} notes:`, scaleNotes);
                scaleNotes.forEach(note => {
                    uniqueNotes.add(note);
                    console.log(`Adding note: ${note}`);
                });
            });
            
            // Convert to sorted array
            const notesNeeded = Array.from(uniqueNotes).sort((a, b) => {
                const chromatic = ['C', 'C#', 'Db', 'D', 'D#', 'Eb', 'E', 'F', 'F#', 'Gb', 'G', 'G#', 'Ab', 'A', 'A#', 'Bb', 'B'];
                return chromatic.indexOf(a) - chromatic.indexOf(b);
            });
            
            console.log("FINAL NOTES FOR PILES:", notesNeeded);
            
            // Store for game logic
            gameState.notesNeeded = notesNeeded;
            
            // Create piles only for needed notes
            notesNeeded.forEach((note, index) => {
                const pile = document.createElement('div');
                pile.className = 'scale-pile';
                pile.id = `pile-${note}`;
                pile.setAttribute('data-note', note);
                
                pile.innerHTML = `
                    <div class="scale-label">${note}</div>
                    <div class="pile-count">0</div>
                    <div class="cards-collected" id="collected-${note}"></div>
                `;
                
                // Add drag and drop events
                pile.addEventListener('dragover', handleDragOver);
                pile.addEventListener('drop', handleDrop);
                
                container.appendChild(pile);
            });
            
            // Adjust grid based on number of piles
            const numPiles = notesNeeded.length;
            let columns = 3;
            if (numPiles <= 8) columns = 4;
            if (numPiles <= 6) columns = 3;
            if (numPiles <= 4) columns = 2;
            
            container.style.gridTemplateColumns = `repeat(${columns}, 1fr)`;
        }

        // Draw cards from deck
        function drawCards() {
            const maxCardsInPlay = 7;
            const cardsToDraw = Math.min(5, gameState.cards.length);
            
            if (gameState.cards.length === 0) return;
            
            // Remove excess cards if needed
            while (gameState.playCards.length > maxCardsInPlay - cardsToDraw) {
                gameState.playCards.shift();
            }
            
            // Draw new cards
            for (let i = 0; i < cardsToDraw && gameState.cards.length > 0; i++) {
                const card = gameState.cards.pop();
                gameState.playCards.push(card);
            }
            
            updatePlayArea();
            updateDeckCount();
        }

        // Update play area with cards
        function updatePlayArea() {
            const container = document.getElementById('playArea');
            container.innerHTML = '';
            
            gameState.playCards.forEach(card => {
                const cardElement = createCardElement(card);
                container.appendChild(cardElement);
            });
        }

        // Create card element
        function createCardElement(card) {
            const cardEl = document.createElement('div');
            cardEl.className = card.faceUp ? 'card face-up' : 'card face-down';
            cardEl.setAttribute('data-card-id', card.id);
            
            if (card.faceUp) {
                cardEl.draggable = true;
                cardEl.innerHTML = `
                    <div class="card-scale-text">Scala di</div>
                    <div class="card-scale">${card.scale}</div>
                    <div class="card-scale-major">maggiore</div>
                    <div class="card-degree">${card.degree}°</div>
                `;
                
                // Desktop drag & drop
                cardEl.addEventListener('dragstart', handleDragStart);
                cardEl.addEventListener('dragend', handleDragEnd);
                
                // Mobile touch events
                cardEl.addEventListener('touchstart', handleTouchStart, { passive: false });
                cardEl.addEventListener('touchmove', handleTouchMove, { passive: false });
                cardEl.addEventListener('touchend', handleTouchEnd, { passive: false });
                
            } else {
                cardEl.innerHTML = `
                    <div class="card-back">
                        <div class="card-back-icon">♠</div>
                        <div class="card-back-text">tap</div>
                    </div>
                `;
                
                // Prevent event propagation and multiple clicks
                cardEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    flipCard(card.id);
                }, { once: true });
            }
            
            return cardEl;
        }

        // Flip card from face-down to face-up
        function flipCard(cardId) {
            const card = gameState.playCards.find(c => c.id === cardId);
            if (!card || card.faceUp) return;
            
            // Prevent multiple rapid clicks
            if (card.flipping) return;
            card.flipping = true;
            
            setTimeout(() => {
                card.faceUp = true;
                card.flipping = false;
                updatePlayArea();
            }, 150);
        }

        // Drag and drop handlers
        function handleDragStart(e) {
            e.target.classList.add('dragging');
            e.dataTransfer.setData('text/plain', e.target.getAttribute('data-card-id'));
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
        }

        function handleDragOver(e) {
            e.preventDefault();
        }

        // Touch handlers for mobile devices
        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const card = e.target.closest('.card');
            
            if (!card || !card.classList.contains('face-up')) return;
            
            touchDragState.isDragging = true;
            touchDragState.draggedCard = card;
            touchDragState.startX = touch.clientX;
            touchDragState.startY = touch.clientY;
            
            card.classList.add('dragging-touch');
        }

        function handleTouchMove(e) {
            if (!touchDragState.isDragging) return;
            
            e.preventDefault();
            const touch = e.touches[0];
            touchDragState.currentX = touch.clientX;
            touchDragState.currentY = touch.clientY;
            
            // Visual feedback - move card with finger
            const card = touchDragState.draggedCard;
            const deltaX = touchDragState.currentX - touchDragState.startX;
            const deltaY = touchDragState.currentY - touchDragState.startY;
            
            card.style.transform = `translate(${deltaX}px, ${deltaY}px) scale(1.1)`;
        }

        function handleTouchEnd(e) {
            if (!touchDragState.isDragging) return;
            
            e.preventDefault();
            const card = touchDragState.draggedCard;
            
            // Reset card position
            card.style.transform = '';
            card.classList.remove('dragging-touch');
            
            // Find what pile we're over
            const touch = e.changedTouches[0];
            const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
            const pile = elementBelow ? elementBelow.closest('.scale-pile') : null;
            
            if (pile) {
                // Simulate drop event
                const cardId = card.getAttribute('data-card-id');
                const targetNote = pile.getAttribute('data-note');
                
                const cardData = gameState.playCards.find(c => c.id === cardId);
                if (cardData) {
                    if (cardData.correctNote === targetNote) {
                        handleCorrectDrop(cardData, targetNote);
                    } else {
                        handleIncorrectDrop(pile);
                    }
                }
            }
            
            // Reset touch state
            touchDragState.isDragging = false;
            touchDragState.draggedCard = null;
        }

        function handleDrop(e) {
            e.preventDefault();
            
            const cardId = e.dataTransfer.getData('text/plain');
            const targetNote = e.currentTarget.getAttribute('data-note');
            
            const card = gameState.playCards.find(c => c.id === cardId);
            if (!card) return;
            
            // Check if correct: EXACT match only (no enharmonic equivalents)
            if (card.correctNote === targetNote) {
                // Correct!
                handleCorrectDrop(card, targetNote);
            } else {
                // Wrong!
                handleIncorrectDrop(e.currentTarget);
            }
        }

        // Handle correct card drop
        function handleCorrectDrop(card, note) {
            gameState.successCount++;
            
            // Remove card from play (carta sparisce!)
            gameState.playCards = gameState.playCards.filter(c => c.id !== card.id);
            
            // Add to collected pile for tracking
            addToCollected(note, card);
            
            // Update UI
            updatePlayArea();
            updateStats();
            updateDeckCount(); // Update footer message
            
            // Show success animation on pile
            const pile = document.getElementById(`pile-${note}`);
            pile.classList.add('highlight');
            setTimeout(() => pile.classList.remove('highlight'), 500);
            
            // Check if game is won
            checkGameCompletion();
        }

        // Add card to collected pile
        function addToCollected(note, card) {
            const container = document.getElementById(`collected-${note}`);
            const cardEl = document.createElement('div');
            cardEl.className = 'collected-card';
            
            // Use Roman numerals: "V di C" instead of "C5"
            const romanDegree = getRomanNumeral(card.degree);
            cardEl.textContent = `${romanDegree} di ${card.scale}`;
            cardEl.title = `${card.scale} maggiore - ${card.degree}° grado (${romanDegree})`;
            
            container.appendChild(cardEl);
            
            // Update count
            const count = container.children.length;
            const countEl = document.querySelector(`#pile-${note} .pile-count`);
            countEl.textContent = count;
        }

        // Handle incorrect card drop
        function handleIncorrectDrop(pile) {
            gameState.errorCount++;
            
            // Show error animation
            pile.classList.add('reject');
            setTimeout(() => pile.classList.remove('reject'), 500);
            
            updateStats();
            updateDeckCount(); // Update footer message
        }

        // Check if game is complete
        function checkGameCompletion() {
            // Game is won when deck is empty and no cards in play
            if (gameState.cards.length === 0 && gameState.playCards.length === 0) {
                showVictory();
            }
        }

        // Show victory screen
        function showVictory() {
            const total = gameState.successCount + gameState.errorCount;
            const accuracy = total > 0 ? Math.round((gameState.successCount / total) * 100) : 0;
            
            document.getElementById('finalSuccess').textContent = gameState.successCount;
            document.getElementById('finalErrors').textContent = gameState.errorCount;
            document.getElementById('accuracy').textContent = accuracy;
            
            document.getElementById('victoryScreen').classList.add('active');
        }

        // Update statistics display
        function updateStats() {
            document.getElementById('successCount').textContent = gameState.successCount;
            document.getElementById('errorCount').textContent = gameState.errorCount;
        }

        // Update deck count and footer
        function updateDeckCount() {
            const deckCountEl = document.getElementById('deckCount');
            const footerTextEl = document.getElementById('footerText');
            
            deckCountEl.textContent = gameState.cards.length;
            
            // Update footer message based on game state
            if (gameState.cards.length === 0 && gameState.playCards.length === 0) {
                footerTextEl.textContent = "🎉 Complimenti! Hai completato tutte le carte!";
            } else if (gameState.cards.length === 0) {
                footerTextEl.textContent = "📝 Completa le carte rimanenti per vincere";
            } else if (gameState.playCards.length === 0) {
                footerTextEl.textContent = "🎴 Pesca carte dal mazzo per continuare";
            } else {
                footerTextEl.textContent = `🎯 Trascina le carte sui box - Carte rimaste: ${gameState.cards.length}`;
            }
        }

        // Navigation functions
        function goToMenu() {
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('victoryScreen').classList.remove('active');
            document.getElementById('menuScreen').classList.add('active');
        }

        function playAgain() {
            document.getElementById('victoryScreen').classList.remove('active');
            startGame(gameState.level);
        }

        if ('serviceWorker' in navigator) {

                .catch(err => console.log('Service Worker registration failed'));
            });

    </script>
