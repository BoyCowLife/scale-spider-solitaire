<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>Scale Spider v1.0</title>

  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Scale Spider" />

  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#334155 100%);color:#e2e8f0;min-height:100vh;overflow-x:hidden;user-select:none;-webkit-user-select:none}
    .container{max-width:500px;margin:0 auto;padding:10px;min-height:100vh}

    /* Menu */
    .menu-screen{display:none;text-align:center;padding:32px 18px}
    .menu-screen.active{display:block}
    .menu-title{font-size:2.3rem;background:linear-gradient(45deg,#3b82f6,#8b5cf6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
    .menu-subtitle{font-size:1.05rem;color:#94a3b8;margin-bottom:28px}
    .level-selection{display:flex;flex-direction:column;gap:14px;margin:28px auto;max-width:300px}
    .level-btn{background:rgba(255,255,255,.05);border:2px solid rgba(59,130,246,.3);border-radius:14px;padding:16px;color:#e2e8f0;font-size:1.05rem;cursor:pointer;transition:all .2s ease;backdrop-filter:blur(10px)}
    .level-btn:hover,.level-btn:active{transform:translateY(-2px);border-color:#3b82f6;background:rgba(59,130,246,.2);box-shadow:0 10px 25px rgba(59,130,246,.3)}
    .level-description{font-size:.85rem;color:#94a3b8;margin-top:4px}

    /* Game */
    .game-screen{display:none}
    .game-screen.active{display:block}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .game-title{font-size:1.35rem;font-weight:700;color:#3b82f6}
    .ver-chip{font-size:.7rem;color:#94a3b8;margin-left:6px}
    .stats{display:flex;gap:12px;align-items:center}
    .stat{display:flex;align-items:center;gap:6px;font-size:1rem}
    .stat-value{font-weight:700}
    .back-btn{background:rgba(59,130,246,.2);border:1px solid rgba(59,130,246,.4);color:#e2e8f0;padding:6px 12px;border-radius:8px;cursor:pointer;transition:all .2s ease;font-size:.9rem}
    .back-btn:hover,.back-btn:active{background:rgba(59,130,246,.3)}

    .legend{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:8px;padding:10px;margin-bottom:12px;text-align:center;font-size:.85rem;color:#94a3b8}

    /* Note boxes */
    .note-boxes{display:grid;gap:8px;grid-template-columns:repeat(3,1fr);margin-bottom:16px}
    .note-box{background:rgba(255,255,255,.03);border:2px dashed rgba(59,130,246,.25);border-radius:12px;padding:14px 8px;text-align:center;transition:all .2s ease;cursor:pointer;position:relative;touch-action:none}
    .note-box.answer-active{border-color:rgba(59,130,246,.55);background:rgba(59,130,246,.15);box-shadow:0 0 10px rgba(59,130,246,.25)}
    .note-box.can-drop{border-color:#10b981;background:rgba(16,185,129,.15);box-shadow:0 0 15px rgba(16,185,129,.3);animation:pulse 1s ease-in-out infinite}
    .note-box.drop-hover{transform:scale(1.05);border-color:#10b981;background:rgba(16,185,129,.25)}
    .note-name{font-size:1rem;font-weight:800;color:#3b82f6;white-space:nowrap}
    .note-count{font-size:.8rem;color:#64748b;margin-top:4px}
    .note-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:6px}
    .note-badge{background:#10b981;color:#0b1424;border-radius:6px;padding:2px 6px;font-size:.7rem;font-weight:800}

    /* Play area */
    .play-area-container{background:rgba(0,0,0,.2);border-radius:16px;padding:12px;margin-bottom:16px}
    .play-wrapper{display:flex;gap:12px;align-items:stretch}
    .play-area{flex:1;display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
    .play-area::-webkit-scrollbar{height:8px}
    .play-area::-webkit-scrollbar-thumb{background:rgba(59,130,246,.3);border-radius:4px}

    /* Cards */
    .card{min-width:80px;width:80px;height:120px;border-radius:12px;cursor:pointer;transition:all .2s ease;transform-style:preserve-3d;position:relative;touch-action:none;-webkit-touch-callout:none}
    .card.face-down{transform:rotateY(0deg)}
    .card.face-up{transform:rotateY(180deg)}
    .card.face-up.selected{border:3px solid #10b981;box-shadow:0 0 20px rgba(16,185,129,.5);transform:scale(1.05) rotateY(180deg) translateY(-10px)}
    .card.dragging{opacity:0.3;transform:scale(0.95) rotateY(180deg)}
    .card.disappearing{animation:cardDisappear .45s ease forwards}
    @keyframes cardDisappear{0%{transform:scale(1) rotateY(180deg);opacity:1}50%{transform:scale(1.2) rotateY(180deg)}100%{transform:scale(0) rotateY(180deg);opacity:0}}
    .card-front,.card-back{position:absolute;width:100%;height:100%;border-radius:12px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column}
    .card-back{background:linear-gradient(135deg,#10b981,#06b6d4);border:2px solid rgba(255,255,255,.1);box-shadow:0 4px 8px rgba(0,0,0,.3)}
    .card-back::before{content:'';position:absolute;top:8px;left:8px;right:8px;bottom:8px;border:2px solid rgba(255,255,255,.2);border-radius:8px}
    .card-back-icon{font-size:2rem;margin-bottom:5px}
    .card-back-text{color:#fff;font-size:.85rem;font-weight:600;text-transform:uppercase}
    .card-front{background:linear-gradient(135deg,#f8fafc,#e2e8f0);border:2px solid #cbd5e1;transform:rotateY(180deg);padding:10px}
    .scale-label{font-size:.62rem;color:#64748b;text-transform:uppercase;letter-spacing:1px}
    .scale-name{font-size:1.35rem;font-weight:800;color:#3b82f6;margin:5px 0}
    .degree-label{font-size:1.15rem;color:#1e293b;font-weight:700}
    .degree-text{font-size:.7rem;color:#64748b;margin-top:5px}

    /* Dragging clone */
    .drag-clone{position:fixed;pointer-events:none;z-index:9999;opacity:0.85;transform:scale(1.1) rotateY(180deg);transition:none;animation:dragPulse 0.5s ease-in-out infinite}
    @keyframes dragPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.2)}}

    /* Score */
    .score-area{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);border-radius:12px;padding:12px;text-align:center;margin-bottom:16px}
    .cards-remaining{font-size:1.8rem;font-weight:700;color:#3b82f6}
    .cards-label{font-size:.9rem;color:#94a3b8;margin-top:4px}

    .status-message{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.95);padding:8px 16px;border-radius:8px;font-size:.9rem;display:flex;align-items:center;gap:10px;opacity:0;transition:opacity .3s ease;z-index:1000}
    .status-message.active{opacity:1}

    /* Modal */
    .modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);z-index:1000;padding:20px}
    .modal.active{display:flex;align-items:center;justify-content:center}
    .modal-content{background:linear-gradient(135deg,#1e293b,#334155);border-radius:20px;padding:30px;text-align:center;max-width:400px;width:100%;box-shadow:0 20px 40px rgba(0,0,0,.5)}
    .modal-title{font-size:2rem;margin-bottom:10px;background:linear-gradient(45deg,#3b82f6,#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .modal-text{color:#94a3b8;margin-bottom:20px}
    .modal-button{background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:white;border:none;padding:12px 30px;border-radius:8px;font-size:1rem;cursor:pointer;transition:transform .3s ease}
    .modal-button:hover,.modal-button:active{transform:scale(1.05)}

    /* FAB Avanza */
    .fab-advance{position:fixed;right:16px;bottom:16px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;box-shadow:0 8px 24px rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);cursor:pointer;z-index:1100;user-select:none;transition:transform .2s ease}
    .fab-advance:active{transform:translateY(1px) scale(.98)}
    .fab-advance[aria-disabled="true"]{opacity:.6;pointer-events:none}
    .fab-badge{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#0ea5e9;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #0f172a}
    .fab-advance.has-cards{animation:fabPulse 2s ease-in-out infinite}
    @keyframes fabPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.7}}

    @media (max-width:390px){
      .note-boxes{grid-template-columns:repeat(3,1fr);gap:6px}
      .note-box{padding:12px 8px}
      .note-name{font-size:1.05rem}
    }
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  </style>
</head>
<body>
  <div class="container">
    <!-- Menu -->
    <div class="menu-screen active" id="menu">
      <h1 class="menu-title">🕷️ Scale Spider</h1>
      <p class="menu-subtitle">Trascina le carte sui box delle note! (Touch & Desktop)</p>

      <div class="level-selection">
        <button class="level-btn" data-level="easy">
          <div>🎵 Facile</div>
          <div class="level-description">3 tonalità casuali (24 carte)</div>
        </button>
        <button class="level-btn" data-level="medium">
          <div>🎼 Medio</div>
          <div class="level-description">6 tonalità casuali (24 carte)</div>
        </button>
        <button class="level-btn" data-level="hard">
          <div>🎹 Difficile</div>
          <div class="level-description">9 tonalità casuali (24 carte)</div>
        </button>
        <button class="level-btn" data-level="expert">
          <div>🌟 Esperto</div>
          <div class="level-description">12 tonalità casuali (24 carte)</div>
        </button>
      </div>
    </div>

    <!-- Game -->
    <div class="game-screen" id="game">
      <div class="header">
        <div class="game-title">🕷️ Scale Spider <span class="ver-chip">v1.0</span></div>
        <div class="stats">
          <div class="stat">✅ <span class="stat-value" id="success">0</span></div>
          <div class="stat">❌ <span class="stat-value" id="errors">0</span></div>
          <button class="back-btn" id="backBtn">☰ Menu</button>
        </div>
      </div>

      <div class="legend">💡 Tocca per girare, trascina per posizionare!</div>

      <div class="note-boxes" id="noteBoxes"></div>

      <div class="play-area-container">
        <div class="play-wrapper">
          <div class="play-area" id="playArea"></div>
        </div>
      </div>

      <div class="score-area">
        <div class="cards-remaining" id="cardsRemaining">24</div>
        <div class="cards-label">Carte rimaste</div>
      </div>

      <div class="status-message" id="statusMessage">
        <span id="statusIcon"></span>
        <span id="statusText"></span>
      </div>
    </div>

    <!-- Win -->
    <div class="modal" id="winModal">
      <div class="modal-content">
        <h2 class="modal-title">🎉 Complimenti!</h2>
        <p class="modal-text">
          Hai completato tutte le 24 carte!<br /><br />
          ✅ Corrette: <span id="finalSuccess">0</span><br />
          ❌ Errori: <span id="finalErrors">0</span><br />
          📊 Precisione: <span id="finalAccuracy">0</span>%
        </p>
        <button class="modal-button" onclick="showMenu()">Nuovo Gioco</button>
      </div>
    </div>
  </div>

  <!-- FAB Avanza -->
  <div class="fab-advance" id="advanceFab" role="button" tabindex="0" aria-label="Avanza (↻)" title="Avanza (↻)">
    ↻
    <span class="fab-badge" id="deckCountFab">0</span>
  </div>

  <script>
    // ======== Touch/Click helper =========
    function addTap(el, handler){
      let fromTouch = false;
      el.addEventListener('touchstart', (e)=>{
        fromTouch = true;
        handler(e);
        e.preventDefault();
      }, {passive:false});
      el.addEventListener('click', (e)=>{
        if(fromTouch){ fromTouch = false; return; }
        handler(e);
      });
    }

    // ======== Musical data =========
    const BOX_NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
    const BOX_DISPLAY_NAMES = ['C','C#/Db','D','D#/Eb','E','F','F#/Gb','G','G#/Ab','A','A#/Bb','B'];
    const NOTE_TO_INDEX = {
      'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'F':5,'E#':5,
      'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11,'Cb':11
    };
    const FULL_KEYS = ['C','G','D','A','E','B','F#','F','Bb','Eb','Ab','Db'];
    const NATURALS  = ['C','F','G'];
    const MAJOR_INTERVALS = [0,2,4,5,7,9,11];
    const ROMAN = ['I','II','III','IV','V','VI','VII'];

    function majorScaleSharpNames(root){
      const idx = NOTE_TO_INDEX[root];
      return MAJOR_INTERVALS.map(off => BOX_NOTES[(idx + off) % 12]);
    }

    // ======== Game State =========
    let gameState = {
      level: 'easy',
      deckQueue: [],
      playCards: [],
      successCount: 0,
      errorCount: 0,
      selectedCard: null,
      cardsRemaining: 0,
      isDragging: false,
      touchDragging: false,
      handSize: 5,
      noteCounts: {},
      badgesByNote: {}
    };

    // Touch drag variables
    let draggedElement = null;
    let draggedClone = null;
    let draggedIndex = null;
    let initialTouchPos = {x: 0, y: 0};

    // ======== UI Bootstrap =========
    window.addEventListener('DOMContentLoaded', () => {
      initMenu();
      renderNoteBoxes();

      const adv = document.getElementById('advanceFab');
      addTap(adv, dealNextHand);
      adv.addEventListener('keydown', (e)=>{ 
        if(e.key==='Enter'||e.key===' '){ 
          e.preventDefault(); 
          dealNextHand(); 
        }
      });
    });

    function initMenu(){
      document.querySelectorAll('.level-btn').forEach(btn=>{
        addTap(btn, (e)=>{ startGame(btn.dataset.level); });
      });
      addTap(document.getElementById('backBtn'), showMenu);
    }

    function showMenu(){
      document.getElementById('menu').classList.add('active');
      document.getElementById('game').classList.remove('active');
      document.getElementById('winModal').classList.remove('active');
    }

    // ======== Level selection =========
    function pickKeysForLevel(level){
      const nByLevel = { easy:3, medium:6, hard:9, expert:12 };
      const n = nByLevel[level] || 3;
      const pool = shuffle(FULL_KEYS.slice());
      const pick = pool.slice(0, n);
      if (level === 'easy' && pick.every(k => NATURALS.includes(k))) {
        const altered = pool.find(k => !NATURALS.includes(k));
        if (altered) pick[Math.floor(Math.random()*pick.length)] = altered;
      }
      return pick;
    }

    // ======== Start Game =========
    function startGame(level){
      gameState = {
        level,
        deckQueue: [],
        playCards: new Array(5).fill(null),
        successCount: 0,
        errorCount: 0,
        selectedCard: null,
        cardsRemaining: 0,
        isDragging: false,
        touchDragging: false,
        handSize: 5,
        noteCounts: {},
        badgesByNote: {},
        totalCards: 24  // Fisso a 24 carte per partita
      };

      BOX_NOTES.forEach(n => { 
        gameState.noteCounts[n]=0; 
        gameState.badgesByNote[n]=[]; 
      });

      const keys = pickKeysForLevel(level);
      const deck = [];
      keys.forEach(root=>{
        const scale = majorScaleSharpNames(root);
        for (let deg=1; deg<=7; deg++){
          deck.push({
            root, 
            degree:deg,
            targetNote: scale[deg-1],
            id:`${root}-${deg}-${Math.random().toString(36).slice(2)}`,
            faceUp:false, 
            removed:false
          });
        }
      });

      // Mescola e prendi solo 24 carte
      const shuffled = shuffle(deck);
      gameState.deckQueue = shuffled.slice(0, 24);
      
      // Riempi la mano iniziale
      for (let i=0;i<gameState.handSize;i++) {
        gameState.playCards[i]=drawFromQueue();
      }

      recalcRemaining();
      updateStats();
      renderNoteBoxes();
      renderPlayArea();
      updateDeckCount();
      updateCardsRemaining();
      updateFabVisibility();  // Nuova funzione

      document.getElementById('menu').classList.remove('active');
      document.getElementById('game').classList.add('active');
    }

    // ======== Deck Management =========
    function shuffle(a){ 
      const arr=[...a]; 
      for(let i=arr.length-1;i>0;i--){ 
        const j=(Math.random()*(i+1))|0; 
        [arr[i],arr[j]]=[arr[j],arr[i]];
      } 
      return arr; 
    }
    
    function drawFromQueue(){ 
      while(gameState.deckQueue.length){ 
        const c=gameState.deckQueue.shift(); 
        if(!c.removed) return c; 
      } 
      return null; 
    }
    
    function addNewCard(slotIndex){ 
      gameState.playCards[slotIndex]=drawFromQueue(); 
      updateDeckCount(); 
      recalcRemaining(); 
    }
    
    function dealNextHand(){
      // Non permettere di rimescolare se non ci sono carte nel mazzo
      const deckCount = gameState.deckQueue.filter(c=>!c.removed).length;
      if(deckCount === 0) return;
      
      for(let i=0;i<gameState.playCards.length;i++){ 
        const c=gameState.playCards[i]; 
        if(c && !c.removed){ 
          gameState.deckQueue.push(c); 
          gameState.playCards[i]=null; 
        } 
      }
      for(let i=0;i<gameState.playCards.length;i++){ 
        if(!gameState.playCards[i]) {
          gameState.playCards[i]=drawFromQueue()||null; 
        }
      }
      gameState.selectedCard=null;
      updateDeckCount(); 
      recalcRemaining(); 
      renderPlayArea(); 
      updateAnswerBoxesActivation();
      updateFabVisibility();
      showStatus('↻','Nuova mano');
    }
    
    function updateFabVisibility(){
      const fab = document.getElementById('advanceFab');
      const deckCount = gameState.deckQueue.filter(c=>!c.removed).length;
      
      if(deckCount === 0) {
        fab.style.display = 'none';
      } else {
        fab.style.display = 'flex';
      }
    }
    
    function updateDeckCount(){
      const count=gameState.deckQueue.filter(c=>!c.removed).length;
      const fab = document.getElementById('advanceFab');
      const badge = document.getElementById('deckCountFab');
      if (badge) badge.textContent = count;
      if (fab) {
        if(count > 0) {
          fab.classList.add('has-cards');
        } else {
          fab.classList.remove('has-cards');
        }
      }
    }
    
    function recalcRemaining(){
      let count=gameState.deckQueue.filter(c=>!c.removed).length;
      for(const c of gameState.playCards) {
        if(c && !c.removed) count++;
      }
      gameState.cardsRemaining=count; 
      updateCardsRemaining();
    }

    // ======== UI Updates =========
    function updateStats(){ 
      document.getElementById('success').textContent=gameState.successCount; 
      document.getElementById('errors').textContent=gameState.errorCount; 
    }
    
    function updateCardsRemaining(){ 
      document.getElementById('cardsRemaining').textContent=gameState.cardsRemaining; 
    }

    // ======== Note Boxes Render =========
    function renderNoteBoxes(){
      const c=document.getElementById('noteBoxes'); 
      c.innerHTML='';
      
      BOX_NOTES.forEach((note, idx)=>{
        const badges = (gameState.badgesByNote[note]||[])
          .map(b=>`<span class="note-badge">${b}</span>`)
          .join('');
        
        const box=document.createElement('div');
        box.className='note-box'; 
        box.dataset.note=note;
        box.innerHTML=`
          <div class="note-name">${BOX_DISPLAY_NAMES[idx]}</div>
          <div class="note-count">${gameState.noteCounts[note]||0}</div>
          <div class="note-badges">${badges}</div>
        `;
        
        // Tap handling
        addTap(box, ()=>handleNoteBoxClick(note));
        
        // Desktop drag&drop
        box.addEventListener('dragover', e=>e.preventDefault());
        box.addEventListener('dragenter', e=>{
          if(gameState.isDragging) {
            box.classList.add('drop-hover');
          }
        });
        box.addEventListener('dragleave', e=>{
          box.classList.remove('drop-hover');
        });
        box.addEventListener('drop', e=>{
          e.preventDefault();
          box.classList.remove('drop-hover');
          const idxStr=e.dataTransfer.getData('text/plain');
          const idx=idxStr?parseInt(idxStr):gameState.selectedCard;
          if(!Number.isInteger(idx)) return;
          const card=gameState.playCards[idx];
          if(!card||!card.faceUp) return;
          placeCardOnNote(card, idx, note);
        });
        
        c.appendChild(box);
      });
    }

    // ======== Play Area Render =========
    function renderPlayArea(){
      const c=document.getElementById('playArea'); 
      c.innerHTML='';
      
      gameState.playCards.forEach((card,idx)=>{
        if(card && !card.removed) {
          c.appendChild(createCard(card,idx));
        } else { 
          const ph=document.createElement('div'); 
          ph.style.width='80px'; 
          ph.style.height='120px'; 
          ph.style.borderRadius='12px'; 
          ph.style.opacity='0.15'; 
          c.appendChild(ph); 
        }
      });
    }

    // ======== Card Creation with Touch Drag =========
    function createCard(card,index){
      const el=document.createElement('div');
      el.className=`card ${card.faceUp?'face-up':'face-down'}`; 
      el.dataset.index=index;
      
      if(gameState.selectedCard===index) el.classList.add('selected');
      
      el.innerHTML=`
        <div class="card-back">
          <div class="card-back-icon">🕷️</div>
          <div class="card-back-text">TAP</div>
        </div>
        <div class="card-front">
          <div class="scale-label">SCALA DI</div>
          <div class="scale-name">${card.root}</div>
          <div class="degree-label">${ROMAN[card.degree-1]}</div>
          <div class="degree-text">grado</div>
        </div>
      `;
      
      // Desktop drag&drop
      if(card.faceUp && !card.removed){
        el.setAttribute('draggable','true');
        el.addEventListener('dragstart', (e)=>{ 
          gameState.isDragging=true; 
          gameState.selectedCard=index;
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', String(index)); 
          setTimeout(()=>el.classList.add('dragging'), 0);
          updateDropTargets(); 
        });
        el.addEventListener('dragend', ()=>{ 
          gameState.isDragging=false; 
          el.classList.remove('dragging');
          document.querySelectorAll('.drop-hover').forEach(box=>
            box.classList.remove('drop-hover')
          );
          updateDropTargets(); 
        });
      } else {
        el.removeAttribute('draggable');
      }

      // Touch handling - più complesso
      el.addEventListener('touchstart', (e)=>handleTouchStart(e, card, index), {passive:false});
      el.addEventListener('touchmove', (e)=>handleTouchMove(e), {passive:false});
      el.addEventListener('touchend', (e)=>handleTouchEnd(e), {passive:false});
      
      // Click per flip
      el.addEventListener('click', (e)=>{
        if(!gameState.touchDragging) {
          handleCardClick(index);
        }
      });
      
      return el;
    }

    // ======== Touch Drag Implementation =========
    function handleTouchStart(e, card, index){
      const touch = e.touches[0];
      initialTouchPos = {x: touch.clientX, y: touch.clientY};
      
      if(!card.faceUp){
        // Se la carta è coperta, solo flip
        return;
      }
      
      // Setup per possibile drag
      draggedElement = e.currentTarget;
      draggedIndex = index;
      gameState.touchDragging = false;
      
      // Previeni scroll durante touch
      e.preventDefault();
    }

    function handleTouchMove(e){
      if(!draggedElement || draggedIndex === null) return;
      
      const card = gameState.playCards[draggedIndex];
      if(!card || !card.faceUp) return;
      
      const touch = e.touches[0];
      const deltaX = Math.abs(touch.clientX - initialTouchPos.x);
      const deltaY = Math.abs(touch.clientY - initialTouchPos.y);
      
      // Inizia drag solo se il movimento è significativo
      if(!gameState.touchDragging && (deltaX > 10 || deltaY > 10)){
        gameState.touchDragging = true;
        
        // Crea clone per feedback visivo
        const rect = draggedElement.getBoundingClientRect();
        draggedClone = draggedElement.cloneNode(true);
        draggedClone.className = 'card face-up drag-clone';
        draggedClone.style.width = rect.width + 'px';
        draggedClone.style.height = rect.height + 'px';
        document.body.appendChild(draggedClone);
        
        // Opacizza carta originale
        draggedElement.classList.add('dragging');
        
        // Evidenzia box target
        const targetBox = document.querySelector(`[data-note="${card.targetNote}"]`);
        if(targetBox) targetBox.classList.add('can-drop');
        
        // Vibrazione feedback (se supportata)
        if(navigator.vibrate) navigator.vibrate(50);
      }
      
      // Muovi clone
      if(gameState.touchDragging && draggedClone){
        draggedClone.style.left = (touch.clientX - 40) + 'px';
        draggedClone.style.top = (touch.clientY - 60) + 'px';
        
        // Evidenzia box sotto il dito
        draggedClone.style.display = 'none';
        const elementBelow = document.elementFromPoint(touch.clientX, touch.clientY);
        draggedClone.style.display = '';
        
        document.querySelectorAll('.note-box').forEach(box=>
          box.classList.remove('drop-hover')
        );
        
        if(elementBelow && elementBelow.closest('.note-box')){
          elementBelow.closest('.note-box').classList.add('drop-hover');
        }
      }
      
      e.preventDefault();
    }

    function handleTouchEnd(e){
      if(!draggedElement) return;
      
      if(gameState.touchDragging && draggedClone){
        // Era un drag, trova target
        const touch = e.changedTouches[0];
        
        // Nascondi clone per trovare elemento sotto
        draggedClone.style.display = 'none';
        const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
        
        // Check se è un note box
        if(targetEl && targetEl.closest('.note-box')){
          const noteBox = targetEl.closest('.note-box');
          const note = noteBox.dataset.note;
          const card = gameState.playCards[draggedIndex];
          
          if(card && card.faceUp){
            placeCardOnNote(card, draggedIndex, note);
          }
        }
        
        // Cleanup
        if(draggedClone){
          draggedClone.remove();
          draggedClone = null;
        }
      } else {
        // Non era un drag, gestisci come tap
        const card = gameState.playCards[draggedIndex];
        if(card && !card.faceUp){
          handleCardClick(draggedIndex);
        }
      }
      
      // Reset
      document.querySelectorAll('.can-drop, .drop-hover, .dragging').forEach(el => {
        el.classList.remove('can-drop', 'drop-hover', 'dragging');
      });
      
      if(draggedElement) draggedElement.classList.remove('dragging');
      
      draggedElement = null;
      draggedIndex = null;
      gameState.touchDragging = false;
      
      e.preventDefault();
    }

    // ======== Card & Box Interactions =========
    function handleCardClick(index){
      const card=gameState.playCards[index]; 
      if(!card||card.removed) return;
      
      if(!card.faceUp){
        card.faceUp=true; 
        gameState.selectedCard=index;
        renderPlayArea(); 
        updateAnswerBoxesActivation();
      }else{
        gameState.selectedCard=(gameState.selectedCard===index)?null:index;
        renderPlayArea(); 
        updateAnswerBoxesActivation(); 
        updateDropTargets();
      }
    }

    function handleNoteBoxClick(note){
      if(gameState.selectedCard===null) return;
      const card=gameState.playCards[gameState.selectedCard]; 
      if(!card||!card.faceUp) return;
      placeCardOnNote(card, gameState.selectedCard, note);
    }

    function updateDropTargets(){
      document.querySelectorAll('.note-box').forEach(b=>b.classList.remove('can-drop'));
      if(!gameState.isDragging) return;
      if(gameState.selectedCard!==null){
        const card=gameState.playCards[gameState.selectedCard];
        if(card && card.faceUp){
          const box=document.querySelector(`[data-note="${card.targetNote}"]`);
          if(box) box.classList.add('can-drop');
        }
      }
    }

    function updateAnswerBoxesActivation(){
      const active=(gameState.selectedCard!==null && 
                    gameState.playCards[gameState.selectedCard] && 
                    gameState.playCards[gameState.selectedCard].faceUp && 
                    !gameState.isDragging && 
                    !gameState.touchDragging);
      document.querySelectorAll('.note-box').forEach(box=>
        box.classList.toggle('answer-active', !!active)
      );
    }

    function placeCardOnNote(card, cardIndex, note){
      if(card.targetNote===note){
        gameState.successCount++;
        gameState.noteCounts[note]=(gameState.noteCounts[note]||0)+1;
        
        // Badge più compatto
        const badgeText = `${card.root}-${ROMAN[card.degree-1]}`;
        (gameState.badgesByNote[note]||=[]).push(badgeText);
        
        showStatus('✅','Corretto!');
        
        // Vibrazione successo
        if(navigator.vibrate) navigator.vibrate([50, 30, 50]);
        
        const el=document.querySelector(`.card[data-index="${cardIndex}"]`);
        const removeNow=()=>{
          card.removed=true;
          gameState.playCards[cardIndex]=null;
          gameState.selectedCard=null;
          addNewCard(cardIndex);
          updateStats(); 
          renderNoteBoxes(); 
          renderPlayArea(); 
          updateAnswerBoxesActivation(); 
          recalcRemaining();
          updateFabVisibility();
          
          // Check se tutte le 24 carte sono state completate
          if(gameState.cardsRemaining === 0) {
            setTimeout(showWin, 500);
          }
        };
        
        if(el){ 
          el.classList.add('disappearing'); 
          el.addEventListener('animationend', removeNow, {once:true}); 
        } else { 
          removeNow(); 
        }
      }else{
        gameState.errorCount++; 
        gameState.selectedCard=null;
        updateStats(); 
        renderPlayArea(); 
        updateAnswerBoxesActivation();
        showStatus('❌', `Era ${card.targetNote}!`);
        
        // Vibrazione errore
        if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
        
        const box=document.querySelector(`[data-note="${note}"]`);
        if(box){ 
          box.style.animation='shake .5s'; 
          setTimeout(()=>box.style.animation='',500); 
        }
      }
    }

    // ======== Status & Win =========
    function showStatus(icon,text){
      const el=document.getElementById('statusMessage');
      document.getElementById('statusIcon').textContent=icon;
      document.getElementById('statusText').textContent=text;
      el.classList.add('active'); 
      setTimeout(()=>el.classList.remove('active'),1400);
    }

    function showWin(){
      const totalMoves = gameState.successCount + gameState.errorCount;
      const accuracy = totalMoves > 0 ? Math.round((gameState.successCount / totalMoves) * 100) : 100;
      
      document.getElementById('finalSuccess').textContent = gameState.successCount;
      document.getElementById('finalErrors').textContent = gameState.errorCount;
      document.getElementById('finalAccuracy').textContent = accuracy;
      document.getElementById('winModal').classList.add('active');
    }

    // Service Worker registration (optional)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
    }
  </script>
</body>
