    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 10px;
            min-height: 100vh;
        }

        /* Menu Screen */
        .menu-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .menu-screen.active {
            display: block;
        }

        .menu-title {
            font-size: 2.5rem;
            background: linear-gradient(45deg, #3b82f6, #8b5cf6, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .menu-subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 40px;
        }

        .level-selection {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 40px auto;
            max-width: 300px;
        }

        .level-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 20px;
            color: #e2e8f0;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .level-btn:hover, .level-btn:active {
            transform: translateY(-2px);
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.2);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .level-description {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        /* Game Screen */
        .game-screen {
            display: none;
        }

        .game-screen.active {
            display: block;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .game-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #3b82f6;
        }

        .stats {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 1.1rem;
        }

        .stat-value {
            font-weight: bold;
        }

        .back-btn {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #e2e8f0;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .back-btn:hover, .back-btn:active {
            background: rgba(59, 130, 246, 0.3);
        }

        /* Legend */
        .legend {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* Note Boxes Grid */
        .note-boxes {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(3, 1fr);
            margin-bottom: 20px;
        }

        .note-box {
            background: rgba(255, 255, 255, 0.03);
            border: 2px dashed rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            padding: 15px 10px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        /* Boxes active state when a card is flipped (no spoiler) */
        .note-box.answer-active {
            border-color: rgba(59, 130, 246, 0.55);
            background: rgba(59, 130, 246, 0.15);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.25);
        }

        .note-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #3b82f6;
        }

        .note-count {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 5px;
        }

        /* Play Area */
        .play-area-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .play-area {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .play-area::-webkit-scrollbar {
            height: 8px;
        }

        .play-area::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .play-area::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.3);
            border-radius: 4px;
        }

        /* Cards */
        .card {
            min-width: 80px;
            width: 80px;
            height: 120px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            transform-style: preserve-3d;
            position: relative;
        }

        .card.face-down {
            transform: rotateY(0deg);
        }

        .card.face-up {
            transform: rotateY(180deg);
        }

        .card.face-up.selected {
            border: 3px solid #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            transform: scale(1.05) rotateY(180deg) translateY(-10px);
        }

        .card.disappearing {
            animation: cardDisappear 0.5s ease forwards;
        }

        @keyframes cardDisappear {
            0% {
                transform: scale(1) rotateY(180deg);
                opacity: 1;
            }
            50% {
                transform: scale(1.2) rotateY(180deg);
            }
            100% {
                transform: scale(0) rotateY(180deg);
                opacity: 0;
            }
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .card-back {
            background: linear-gradient(135deg, #10b981, #06b6d4);
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .card-back::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
        }

        .card-back-icon {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .card-back-text {
            color: white;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .card-front {
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            border: 2px solid #cbd5e1;
            transform: rotateY(180deg);
            padding: 10px;
        }

        .scale-label {
            font-size: 0.65rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .scale-name {
            font-size: 1.4rem;
            font-weight: bold;
            color: #3b82f6;
            margin: 5px 0;
        }

        .degree-label {
            font-size: 1.2rem;
            color: #1e293b;
            font-weight: 600;
        }

        .degree-text {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 5px;
        }

        /* Score Display */
        .score-area {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin-bottom: 20px;
        }

        .cards-remaining {
            font-size: 2rem;
            font-weight: bold;
            color: #3b82f6;
        }

        .cards-label {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 5px;
        }

        /* Status Message */
        .status-message {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .status-message.active {
            opacity: 1;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            padding: 20px;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e293b, #334155);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .modal-title {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .modal-text {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .modal-button {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .modal-button:hover, .modal-button:active {
            transform: scale(1.05);
        }

        /* Responsive adjustments */
        @media (max-width: 390px) {
            .note-boxes {
                grid-template-columns: repeat(3, 1fr);
                gap: 5px;
            }
            
            .note-box {
                padding: 12px 8px;
            }
            
            .note-name {
                font-size: 1.1rem;
            }
        }

        /* Shake animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Menu Screen -->
        <div class="menu-screen active">
            <h1 class="menu-title">🕷️ Scale Spider</h1>

            <div class="level-selection">
                <button class="level-btn" data-level="easy">
                    <div>🎵 Facile</div>

                </button>
                
                <button class="level-btn" data-level="medium">
                    <div>🎼 Medio</div>

                    <div class="level-description">Tutte 12 scale! (84 carte)</div>

            </div>
        </div>

        <!-- Game Screen -->
        <div class="game-screen">
            <div class="header">
                <div class="game-title">🕷️ Scale Spider</div>

                    <div class="stat">
                        ✅ <span class="stat-value" id="success">0</span>
                    </div>
                    <div class="stat">
                        ❌ <span class="stat-value" id="errors">0</span>

            <div class="legend">
                💡 Tocca una carta per selezionarla, poi tocca il box della nota
            </div>

            <div class="note-boxes" id="noteBoxes"></div>

            <div class="play-area-container">
                <div class="play-area" id="playArea"></div>
            </div>

            <div class="score-area">

        <!-- Win Modal -->

                <p class="modal-text">
                    Hai completato il livello!<br>
                    Mosse: <span id="finalMoves">0</span><br>

                </p>
                <button class="modal-button" onclick="showMenu()">Nuovo Gioco</button>
            </div>

    <script>
        // Music theory data
        const noteOrder = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
        const allNotes = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
        
        // Enharmonic equivalents for display
        const enharmonicMap = {
            'C#': 'Db', 'Db': 'C#',
            'D#': 'Eb', 'Eb': 'D#',
            'F#': 'Gb', 'Gb': 'F#',
            'G#': 'Ab', 'Ab': 'G#',
            'A#': 'Bb', 'Bb': 'A#'
        };

        // Major scale intervals (W-W-H-W-W-W-H)
        const majorScaleIntervals = [0, 2, 4, 5, 7, 9, 11];

        // Roman numerals for degrees
        const romanNumerals = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII'];

        // Game State
        let gameState = {
                level: level,
                allCards: [],
                playCards: [],
                noteBoxes: {},
                successCount: 0,
                errorCount: 0,
                selectedCard: null,
                cardsRemaining: 0,
                isDragging: false
            };

            // Initialize note boxes (all 12 notes)
            allNotes.forEach(note => {
                gameState.noteBoxes[note] = 0;
            });

            // Generate all cards for selected scales
            const scales = levelConfigs[level];
            scales.forEach(root => {
                const scale = generateMajorScale(root);
                for (let degree = 1; degree <= 7; degree++) {
                    const targetNote = scale[degree - 1];
                    gameState.allCards.push({
                        root: root,
                        degree: degree,
                        targetNote: targetNote,
                        id: `${root}-${degree}`,
                        faceUp: false,
                        removed: false
                    });
                }
            });

            // Shuffle and prepare play cards
            gameState.allCards = shuffleArray(gameState.allCards);
            gameState.playCards = gameState.allCards.slice(0, Math.min(5, gameState.allCards.length));
            gameState.cardsRemaining = gameState.allCards.length;

            // Update UI
            updateStats();
            renderNoteBoxes();
            renderPlayArea();
            updateCardsRemaining();

            // Show game screen
            document.querySelector('.menu-screen').classList.remove('active');
            document.querySelector('.game-screen').classList.add('active');
        }

        // Shuffle array
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        // Update stats
        function updateStats() {
            document.getElementById('success').textContent = gameState.successCount;
            document.getElementById('errors').textContent = gameState.errorCount;
        }

        // Update cards remaining
        function updateCardsRemaining() {
            document.getElementById('cardsRemaining').textContent = gameState.cardsRemaining;
        }

        // Render note boxes
        function renderNoteBoxes() {
            const container = document.getElementById('noteBoxes');
            container.innerHTML = '';

            allNotes.forEach(note => {
                const box = document.createElement('div');
                box.className = 'note-box';
                box.dataset.note = note;
                
                box.innerHTML = `
                    <div class="note-name">${note}</div>
                    <div class="note-count">${gameState.noteBoxes[note]}</div>
                `;

                box.onclick = () => handleNoteBoxClick(note);
                container.appendChild(box);
            });
        }

        // Render play area
        function renderPlayArea() {
            const container = document.getElementById('playArea');
            container.innerHTML = '';

            gameState.playCards.forEach((card, index) => {
                if (!card.removed) {
                    const cardEl = createCardElement(card, index);
                    container.appendChild(cardEl);
                }
            });
        }

        // Create card element
        function createCardElement(card, index) {
            const cardEl = document.createElement('div');
            cardEl.className = `card ${card.faceUp ? 'face-up' : 'face-down'}`;
            cardEl.dataset.index = index;
            
            if (gameState.selectedCard === index) {
                cardEl.classList.add('selected');
            }

            cardEl.innerHTML = `
                <div class="card-back">
                    <div class="card-back-icon">🕷️</div>
                    <div class="card-back-text">TAP</div>
                </div>
                <div class="card-front">
                    <div class="scale-label">SCALA DI</div>
                    <div class="scale-name">${card.root}</div>
                    <div class="degree-label">${romanNumerals[card.degree - 1]}</div>
                    <div class="degree-text">grado</div>
                </div>
            `;

            // Abilita drag solo quando la carta è a faccia in su
            if (card.faceUp && !card.removed) {
                cardEl.setAttribute('draggable', 'true');
                cardEl.addEventListener('dragstart', () => {
                    gameState.isDragging = true;
                    updateDropTargets();
                });
                cardEl.addEventListener('dragend', () => {
                    gameState.isDragging = false;
                    updateDropTargets();
                });
            } else {
                cardEl.removeAttribute('draggable');
            }

            cardEl.onclick = () => handleCardClick(index);
            return cardEl;
        }

        // Handle card click
        function handleCardClick(index) {
            const card = gameState.playCards[index];
            if (!card || card.removed) return;

            if (!card.faceUp) {
                // Flip card and auto-select it
                card.faceUp = true;
                gameState.selectedCard = index;
                renderPlayArea();
                updateAnswerBoxesActivation(); // light up all boxes (contextual to flip)
            } else {
                // Select/deselect when already face up
                if (gameState.selectedCard === index) {
                    gameState.selectedCard = null;
                } else {
                    gameState.selectedCard = index;
                }
                renderPlayArea();
                updateAnswerBoxesActivation();
                updateDropTargets(); // still only highlights correct during drag
            }
        } else {
                // Select/deselect card
                if (gameState.selectedCard === index) {
                    gameState.selectedCard = null;
                } else {
                    gameState.selectedCard = index;
                }
                renderPlayArea();
                updateDropTargets();
            }
        }

        // Handle note box click
        function handleNoteBoxClick(note) {
            if (gameState.selectedCard === null) return;

            const card = gameState.playCards[gameState.selectedCard];
            if (!card || !card.faceUp) return;

            if (card.targetNote === note) {
                // Correct placement
                gameState.successCount++;
                gameState.noteBoxes[note]++;
                gameState.cardsRemaining--;
                
                showStatus('✅', 'Corretto!');
                
                // Animate and remove card
                const cardEl = document.querySelector(`[data-index="${gameState.selectedCard}"]`);
                if (cardEl) cardEl.classList.add('disappearing');
                
                setTimeout(() => {
                    card.removed = true;
                    const selectedIndex = gameState.selectedCard;
                    gameState.selectedCard = null;
                    
                    // Add new card from deck
                    addNewCard(selectedIndex);
                    
                    updateStats();
                    updateCardsRemaining();
                    renderNoteBoxes();
                    renderPlayArea();
                    updateAnswerBoxesActivation(); // turn off after placing
                    
                    // Check win condition
                    if (gameState.cardsRemaining === 0) {
                        showWin();
                    }
                }, 500);
            } else {
                // Wrong placement
                gameState.errorCount++;
                gameState.selectedCard = null;
                updateStats();
                renderPlayArea();
                updateAnswerBoxesActivation(); // turn off on cancel
                
                showStatus('❌', `Era ${card.targetNote}!`);
                
                // Visual feedback
                const box = document.querySelector(`[data-note="${note}"]`);
                if (box){
                    box.style.animation = 'shake 0.5s';
                    setTimeout(() => { box.style.animation = ''; }, 500);
                }
            }
        }"]`);

                    // Add new card from deck
                    addNewCard(selectedIndex);
                    
                    updateStats();
                    updateCardsRemaining();
                    renderNoteBoxes();
                    renderPlayArea();
                    
                    // Check win condition
                    if (gameState.cardsRemaining === 0) {
                        showWin();
                    }
                }, 500);
            } else {
                // Wrong placement
                gameState.errorCount++;
                gameState.selectedCard = null;
                updateStats();
                renderPlayArea();
                
                showStatus('❌', `Era ${card.targetNote}!`);
                
                // Visual feedback
                const box = document.querySelector(`[data-note="${note}"]`);
                box.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    box.style.animation = '';
                }, 500);
            }
        }

        // Update drop targets
        function updateDropTargets() {
            document.querySelectorAll('.note-box').forEach(box => {
                box.classList.remove('can-drop');
            });
            if (!gameState.isDragging) return;
            if (gameState.selectedCard !== null) {
                const card = gameState.playCards[gameState.selectedCard];
                if (card && card.faceUp) {
                    const correctBox = document.querySelector(`[data-note="${card.targetNote}"]`);
                    if (correctBox) correctBox.classList.add('can-drop');
                }
            }
        }

        // Toggle activation of answer boxes when a card is flipped/selected (no spoiler)
        function updateAnswerBoxesActivation(){
            const hasActive = (gameState.selectedCard !== null && gameState.playCards[gameState.selectedCard] && gameState.playCards[gameState.selectedCard].faceUp && !gameState.isDragging);
            document.querySelectorAll('.note-box').forEach(box => {
                box.classList.toggle('answer-active', !!hasActive);
            });
        });
            if (!gameState.isDragging) return;
            if (gameState.selectedCard !== null) {
                const card = gameState.playCards[gameState.selectedCard];
                if (card && card.faceUp) {
                    const correctBox = document.querySelector(`[data-note="${card.targetNote}"]`);
                    if (correctBox) correctBox.classList.add('can-drop');
                }
            }
        }

        // Add new card from deck
        function addNewCard(slotIndex) {
            // Find next unplayed card
            for (let card of gameState.allCards) {
                if (!gameState.playCards.includes(card) && !card.removed) {
                    gameState.playCards[slotIndex] = card;
                    break;
                }
            }
        }

        // Show status message
        function showStatus(icon, text) {
            const statusEl = document.getElementById('statusMessage');
            document.getElementById('statusIcon').textContent = icon;
            document.getElementById('statusText').textContent = text;
            
            statusEl.classList.add('active');
            setTimeout(() => {
                statusEl.classList.remove('active');
            }, 2000);
        }

        // Show win modal
        function showWin() {
            document.getElementById('finalMoves').textContent = gameState.successCount + gameState.errorCount;
            document.getElementById('finalErrors').textContent = gameState.errorCount;
            document.getElementById('winModal').classList.add('active');
        }

        // Initialize
        initMenu();
    </script>
</body>
</html>
