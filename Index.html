<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0"
  />
  <title>Scale Spider</title>

  <!-- PWA -->
  <meta name="theme-color" content="#0f172a" />
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Scale Spider" />
  <!-- Apple touch icon (PNG inline minimale; puoi sostituire con un file PNG in /icons) -->
  <link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAAC0CAYAAAA9U9ZpAAAACXBIWXMAAAsSAAALEgHS3X78AAABgUlEQVR4nO3RMQEAIAwEsH//Z8kq8mCk8J9UATJ0cQAAAAAAAAAAAAAAAAAAwGf7aT9V9WcP9w6o4f8y0wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAkC8C6wAAgP+F5gEAAAD+8C0AAAAAAAAAAAAAAAAAAAB4bS3zAAAgHcK3AAAAAElFTkSuQmCC" />

  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#334155 100%);color:#e2e8f0;min-height:100vh;overflow-x:hidden;user-select:none}
    .container{max-width:500px;margin:0 auto;padding:10px;min-height:100vh}

    .menu-screen{display:none;text-align:center;padding:40px 20px}
    .menu-screen.active{display:block}
    .menu-title{font-size:2.4rem;background:linear-gradient(45deg,#3b82f6,#8b5cf6,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
    .menu-subtitle{font-size:1.1rem;color:#94a3b8;margin-bottom:32px}
    .level-selection{display:flex;flex-direction:column;gap:16px;margin:32px auto;max-width:300px}
    .level-btn{background:rgba(255,255,255,.05);border:2px solid rgba(59,130,246,.3);border-radius:16px;padding:16px;color:#e2e8f0;font-size:1.1rem;cursor:pointer;transition:all .25s ease;backdrop-filter:blur(10px)}
    .level-btn:hover,.level-btn:active{transform:translateY(-2px);border-color:#3b82f6;background:rgba(59,130,246,.2);box-shadow:0 10px 25px rgba(59,130,246,.3)}
    .level-description{font-size:.9rem;color:#94a3b8;margin-top:6px}

    .game-screen{display:none}
    .game-screen.active{display:block}
    .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .game-title{font-size:1.4rem;font-weight:700;color:#3b82f6}
    .stats{display:flex;gap:12px;align-items:center}
    .stat{display:flex;align-items:center;gap:6px;font-size:1rem}
    .stat-value{font-weight:700}
    .back-btn{background:rgba(59,130,246,.2);border:1px solid rgba(59,130,246,.4);color:#e2e8f0;padding:6px 12px;border-radius:8px;cursor:pointer;transition:all .2s ease;font-size:.9rem}
    .back-btn:hover,.back-btn:active{background:rgba(59,130,246,.3)}

    .legend{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:8px;padding:10px;margin-bottom:12px;text-align:center;font-size:.85rem;color:#94a3b8}

    .note-boxes{display:grid;gap:8px;grid-template-columns:repeat(3,1fr);margin-bottom:16px}
    .note-box{background:rgba(255,255,255,.03);border:2px dashed rgba(59,130,246,.2);border-radius:12px;padding:14px 8px;text-align:center;transition:all .2s ease;cursor:pointer;position:relative}
    .note-box.can-drop{border-color:#10b981;background:rgba(16,185,129,.15);box-shadow:0 0 15px rgba(16,185,129,.3)}
    .note-name{font-size:1.2rem;font-weight:700;color:#3b82f6}
    .note-count{font-size:.8rem;color:#64748b;margin-top:4px}
    .degree-badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
    .degree-badge{padding:2px 8px;border-radius:9999px;border:1px solid rgba(16,185,129,.5);background:rgba(16,185,129,.12);font-size:.75rem;color:#d1fae5;user-select:none}

    .play-area-container{background:rgba(0,0,0,.2);border-radius:16px;padding:12px;margin-bottom:16px}
    .play-area{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
    .play-area::-webkit-scrollbar{height:8px}
    .play-area::-webkit-scrollbar-thumb{background:rgba(59,130,246,.3);border-radius:4px}

    .card{min-width:80px;width:80px;height:120px;border-radius:12px;cursor:pointer;transition:all .2s ease;transform-style:preserve-3d;position:relative;touch-action:manipulation}
    .card.face-down{transform:rotateY(0deg)}
    .card.face-up{transform:rotateY(180deg)}
    .card.face-up.selected{border:3px solid #10b981;box-shadow:0 0 20px rgba(16,185,129,.5);transform:scale(1.05) rotateY(180deg) translateY(-10px)}
    .card.disappearing{animation:cardDisappear .5s ease forwards}
    @keyframes cardDisappear{0%{transform:scale(1) rotateY(180deg);opacity:1}50%{transform:scale(1.2) rotateY(180deg)}100%{transform:scale(0) rotateY(180deg);opacity:0}}
    .card-front,.card-back{position:absolute;width:100%;height:100%;border-radius:12px;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column}
    .card-back{background:linear-gradient(135deg,#10b981,#06b6d4);border:2px solid rgba(255,255,255,.1);box-shadow:0 4px 8px rgba(0,0,0,.3)}
    .card-back::before{content:'';position:absolute;top:8px;left:8px;right:8px;bottom:8px;border:2px solid rgba(255,255,255,.2);border-radius:8px}
    .card-back-icon{font-size:2rem;margin-bottom:5px}
    .card-back-text{color:#fff;font-size:.85rem;font-weight:600;text-transform:uppercase}
    .card-front{background:linear-gradient(135deg,#f8fafc,#e2e8f0);border:2px solid #cbd5e1;transform:rotateY(180deg);padding:10px}
    .scale-label{font-size:.65rem;color:#64748b;text-transform:uppercase;letter-spacing:1px}
    .scale-name{font-size:1.4rem;font-weight:700;color:#3b82f6;margin:5px 0}
    .degree-label{font-size:1.2rem;color:#1e293b;font-weight:600}
    .degree-text{font-size:.7rem;color:#64748b;margin-top:5px}

    .score-area{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);border-radius:12px;padding:12px;text-align:center;margin-bottom:16px}
    .cards-remaining{font-size:1.8rem;font-weight:700;color:#3b82f6}
    .cards-label{font-size:.9rem;color:#94a3b8;margin-top:4px}

    .status-message{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.95);padding:8px 16px;border-radius:8px;font-size:.9rem;display:flex;align-items:center;gap:10px;opacity:0;transition:opacity .3s ease;z-index:1000}
    .status-message.active{opacity:1}

    @media (max-width:390px){
      .note-boxes{grid-template-columns:repeat(3,1fr);gap:6px}
      .note-box{padding:12px 8px}
      .note-name{font-size:1.1rem}
    }
    @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  </style>
</head>
<body>
  <div class="container">
    <!-- Menu -->
    <div class="menu-screen active" id="menu">
      <h1 class="menu-title">🕷️ Scale Spider</h1>
      <p class="menu-subtitle">Riconosci i gradi delle scale (tutte le 12 tonalità)! 🎶</p>

      <div class="level-selection">
        <button class="level-btn" data-level="easy">
          <div>🎵 Facile</div>
          <div class="level-description">C, F, G (21 carte)</div>
        </button>
        <button class="level-btn" data-level="medium">
          <div>🎼 Medio</div>
          <div class="level-description">+ D, Bb, A (42 carte)</div>
        </button>
        <button class="level-btn" data-level="hard">
          <div>🎹 Difficile</div>
          <div class="level-description">+ Eb, E, Ab (63 carte)</div>
        </button>
        <button class="level-btn" data-level="expert">
          <div>🌟 Esperto</div>
          <div class="level-description">Tutte 12 scale! (84 carte)</div>
        </button>
      </div>
    </div>

    <!-- Game -->
    <div class="game-screen" id="game">
      <div class="header">
        <div class="game-title">🕷️ Scale Spider</div>
        <div class="stats">
          <div class="stat">✅ <span class="stat-value" id="success">0</span></div>
          <div class="stat">❌ <span class="stat-value" id="errors">0</span></div>
          <button class="back-btn" id="backBtn">☰ Menu</button>
        </div>
      </div>

      <div class="legend">Tocca una carta per girarla, poi tocca il box della nota (oppure trascina dove supportato).</div>

      <div class="note-boxes" id="noteBoxes"></div>

      <div class="play-area-container">
        <div class="play-area" id="playArea"></div>
      </div>

      <div class="score-area">
        <div class="cards-remaining" id="cardsRemaining">0</div>
        <div class="cards-label">Carte rimaste</div>
      </div>

      <div class="status-message" id="statusMessage">
        <span id="statusIcon"></span>
        <span id="statusText"></span>
      </div>
    </div>

    <!-- Win -->
    <div class="modal" id="winModal">
      <div class="modal-content">
        <h2 class="modal-title">🎉 Complimenti!</h2>
        <p class="modal-text">
          Hai completato il livello!<br />
          Mosse: <span id="finalMoves">0</span><br />
          Errori: <span id="finalErrors">0</span>
        </p>
        <button class="modal-button" onclick="showMenu()">Nuovo Gioco</button>
      </div>
    </div>
  </div>

  <script>
    // --- Teoria: 12 scale maggiori con spelling corretto ---
    // Useremo questo set di 12 tonalità (circle of fifths standard):
    // C, G, D, A, E, B, F#, F, Bb, Eb, Ab, Db, Gb
    const MAJOR_SCALES = {
      'C' : ['C','D','E','F','G','A','B'],
      'G' : ['G','A','B','C','D','E','F#'],
      'D' : ['D','E','F#','G','A','B','C#'],
      'A' : ['A','B','C#','D','E','F#','G#'],
      'E' : ['E','F#','G#','A','B','C#','D#'],
      'B' : ['B','C#','D#','E','F#','G#','A#'],
      'F#': ['F#','G#','A#','B','C#','D#','E#'],
      'F' : ['F','G','A','Bb','C','D','E'],
      'Bb': ['Bb','C','D','Eb','F','G','A'],
      'Eb': ['Eb','F','G','Ab','Bb','C','D'],
      'Ab': ['Ab','Bb','C','Db','Eb','F','G'],
      'Db': ['Db','Eb','F','Gb','Ab','Bb','C'],
      'Gb': ['Gb','Ab','Bb','Cb','Db','Eb','F']
    };

    // Nota: nell'elenco livelli "expert" includiamo 12 tonalità (usando F# e Gb entrambe per coprire i 12 pitch class).
    // Safari iOS: DnD è limitato → garantiamo sempre tap→box.

    const allNotes = ['C','C#','D','Eb','E','F','F#','G','Ab','A','Bb','B']; // per i box (12 semitoni)
    const romanNumerals = ['I','II','III','IV','V','VI','VII'];

    const levelConfigs = {
      easy:   ['C','F','G'],
      medium: ['C','F','G','D','Bb','A'],
      hard:   ['C','F','G','D','Bb','A','Eb','E','Ab'],
      expert: ['C','G','D','A','E','B','F#','F','Bb','Eb','Ab','Db'] // 12 key set
      // Se vuoi includere anche 'Gb' al posto di una delle altre, basta aggiungerla.
    };

    function generateMajorScale(root){
      // Usa la tabella se disponibile; evita errori enarmonici.
      if (MAJOR_SCALES[root]) return MAJOR_SCALES[root].slice();
      // fallback: C maggiore
      return ['C','D','E','F','G','A','B'];
    }

    // --- Stato ---
    let gameState = {
      level: 'easy',
      allCards: [],
      playCards: [],
      noteBoxes: {},
      noteHits: {},
      successCount: 0,
      errorCount: 0,
      selectedCard: null,
      cardsRemaining: 0,
      isDragging: false
    };

    // --- UI bootstrap ---
    window.addEventListener('DOMContentLoaded', () => {
      initMenu();
      // registra SW
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./service-worker.js').catch(console.error);
      }
    });

    function initMenu(){
      document.querySelectorAll('.level-btn').forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          e.preventDefault();
          startGame(btn.dataset.level);
        }, {passive:true});
      });
      document.getElementById('backBtn').addEventListener('click', (e)=>{
        e.preventDefault();
        showMenu();
      }, {passive:true});
    }

    function showMenu(){
      document.getElementById('menu').classList.add('active');
      document.getElementById('game').classList.remove('active');
      document.getElementById('winModal').classList.remove('active');
    }

    // --- Logica gioco ---
    function startGame(level){
      gameState = {
        level,
        allCards: [],
        playCards: [],
        noteBoxes: {},
        noteHits: {},
        successCount: 0,
        errorCount: 0,
        selectedCard: null,
        cardsRemaining: 0,
        isDragging: false
      };

      // inizializza box note
      allNotes.forEach(n=>{
        gameState.noteBoxes[n] = 0;
        gameState.noteHits[n] = [];
      });

      const keys = levelConfigs[level] || [];
      keys.forEach(root=>{
        const scale = generateMajorScale(root);
        for (let degree=1; degree<=7; degree++){
          const targetNote = scale[degree-1];
          gameState.allCards.push({
            root, degree, targetNote,
            id: `${root}-${degree}-${Math.random().toString(36).slice(2)}`,
            faceUp: false, removed: false
          });
        }
      });

      // mischia e prepara
      gameState.allCards = shuffle(gameState.allCards);
      gameState.playCards = gameState.allCards.slice(0, Math.min(5, gameState.allCards.length));
      gameState.cardsRemaining = gameState.allCards.length;

      updateStats();
      renderNoteBoxes();
      renderPlayArea();
      updateCardsRemaining();

      // mostra gioco
      document.getElementById('menu').classList.remove('active');
      document.getElementById('game').classList.add('active');
    }

    function shuffle(a){
      const arr=[...a];
      for (let i=arr.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
      }
      return arr;
    }

    function updateStats(){
      document.getElementById('success').textContent = gameState.successCount;
      document.getElementById('errors').textContent  = gameState.errorCount;
    }
    function updateCardsRemaining(){
      document.getElementById('cardsRemaining').textContent = gameState.cardsRemaining;
    }

    function renderNoteBoxes(){
      const c = document.getElementById('noteBoxes');
      c.innerHTML = '';
      allNotes.forEach(note=>{
        const box = document.createElement('div');
        box.className = 'note-box';
        box.dataset.note = note;

        const degrees = gameState.noteHits[note] || [];
        box.innerHTML = `
          <div class="note-name">${note}</div>
          <div class="note-count">${gameState.noteBoxes[note]}</div>
          <div class="degree-badges">${degrees.map(d=>`<span class="degree-badge">${d}</span>`).join('')}</div>
        `;

        // Tap primario (iOS safe)
        box.onclick = () => handleNoteBoxClick(note);

        // DnD (dove supportato)
        box.addEventListener('dragover', e=>e.preventDefault());
        box.addEventListener('drop', e=>{
          e.preventDefault();
          const idxStr = e.dataTransfer.getData('text/plain');
          const idx = idxStr ? parseInt(idxStr) : gameState.selectedCard;
          if (!Number.isInteger(idx)) return;
          const card = gameState.playCards[idx];
          if (!card || !card.faceUp) return;
          placeCardOnNote(card, idx, note);
        });

        c.appendChild(box);
      });
    }

    function renderPlayArea(){
      const c = document.getElementById('playArea');
      c.innerHTML = '';
      gameState.playCards.forEach((card, idx)=>{
        if (card && !card.removed) c.appendChild(createCard(card, idx));
      });
    }

    function createCard(card, index){
      const el = document.createElement('div');
      el.className = `card ${card.faceUp ? 'face-up' : 'face-down'}`;
      el.dataset.index = index;
      if (gameState.selectedCard === index) el.classList.add('selected');

      el.innerHTML = `
        <div class="card-back">
          <div class="card-back-icon">🕷️</div>
          <div class="card-back-text">TAP</div>
        </div>
        <div class="card-front">
          <div class="scale-label">SCALA DI</div>
          <div class="scale-name">${card.root}</div>
          <div class="degree-label">${romanNumerals[card.degree-1]}</div>
          <div class="degree-text">grado</div>
        </div>
      `;

      // DnD dove supportato (non affidabile su iOS Safari)
      if (card.faceUp && !card.removed && !/iPhone|iPad|iPod/i.test(navigator.userAgent)){
        el.setAttribute('draggable','true');
        el.addEventListener('dragstart', (e)=>{
          gameState.isDragging = true;
          e.dataTransfer.setData('text/plain', String(index));
          updateDropTargets();
        });
        el.addEventListener('dragend', ()=>{
          gameState.isDragging = false;
          updateDropTargets();
        });
      } else {
        el.removeAttribute('draggable');
      }

      el.onclick = () => handleCardClick(index);
      return el;
    }

    function handleCardClick(index){
      const card = gameState.playCards[index];
      if (!card || card.removed) return;

      if (!card.faceUp){
        card.faceUp = true;
        renderPlayArea();
      } else {
        gameState.selectedCard = (gameState.selectedCard === index) ? null : index;
        renderPlayArea();
        updateDropTargets(); // non mostra highlight se non dragging
      }
    }

    function handleNoteBoxClick(note){
      if (gameState.selectedCard === null) return;
      const card = gameState.playCards[gameState.selectedCard];
      if (!card || !card.faceUp) return;
      placeCardOnNote(card, gameState.selectedCard, note);
    }

    function updateDropTargets(){
      document.querySelectorAll('.note-box').forEach(b=>b.classList.remove('can-drop'));
      if (!gameState.isDragging) return;
      if (gameState.selectedCard !== null){
        const card = gameState.playCards[gameState.selectedCard];
        if (card && card.faceUp){
          const box = document.querySelector(`[data-note="${card.targetNote}"]`);
          if (box) box.classList.add('can-drop');
        }
      }
    }

    function placeCardOnNote(card, cardIndex, note){
      if (card.targetNote === note){
        gameState.successCount++;
        gameState.noteBoxes[note]++;
        const roman = romanNumerals[card.degree-1];
        if (!gameState.noteHits[note].includes(roman)) gameState.noteHits[note].push(roman);
        gameState.cardsRemaining--;

        showStatus('✅','Corretto!');
        const el = document.querySelector(`.card[data-index="${cardIndex}"]`);
        if (el) el.classList.add('disappearing');

        setTimeout(()=>{
          card.removed = true;
          gameState.selectedCard = null;
          addNewCard(cardIndex);
          updateStats();
          updateCardsRemaining();
          renderNoteBoxes();
          renderPlayArea();
          if (gameState.cardsRemaining === 0) showWin();
        }, 450);
      } else {
        gameState.errorCount++;
        gameState.selectedCard = null;
        updateStats();
        renderPlayArea();
        showStatus('❌', `Era ${card.targetNote}!`);
        const box = document.querySelector(`[data-note="${note}"]`);
        if (box){ box.style.animation = 'shake .5s'; setTimeout(()=> box.style.animation = '', 500); }
      }
    }

    function addNewCard(slotIndex){
      for (let card of gameState.allCards){
        if (!gameState.playCards.includes(card) && !card.removed){
          gameState.playCards[slotIndex] = card;
          return;
        }
      }
      gameState.playCards[slotIndex] = null;
    }

    function showStatus(icon, text){
      const el = document.getElementById('statusMessage');
      document.getElementById('statusIcon').textContent = icon;
      document.getElementById('statusText').textContent = text;
      el.classList.add('active');
      setTimeout(()=> el.classList.remove('active'), 1500);
    }

    function showWin(){
      document.getElementById('finalMoves').textContent = gameState.successCount + gameState.errorCount;
      document.getElementById('finalErrors').textContent = gameState.errorCount;
      document.getElementById('winModal').classList.add('active');
    }
  </script>
</body>
</html>
